# @package _global_
# New English-guide expert/DAgger collection only. Standard HabitatSim avoids
# loading the benchmark-only val_unseen mesh audit. This does not recreate the
# historical collected trajectory pool or alter vln_rxr.yaml evaluation.
defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - _self_

habitat:
  environment:
    max_episode_steps: 500
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: false
  simulator:
    type: Sim-v0
    agents:
      main_agent:
        height: 1.5
        radius: 0.1
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0.0, 1.25, 0.0]
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0.0, 1.25, 0.0]
            min_depth: 0.0
            max_depth: 10.0
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: true
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError
      path_length:
        type: PathLength
      steps_taken:
        type: StepsTaken
  dataset:
    type: RxREnglishGuideVLNCE-v1
    split: train
    scenes_dir: ${oc.env:GUIDEDNAV_SCENES_DIR}
    data_path: ${oc.env:VLN_TRAIN_DATA_PATH}
